<!doctype html><body style="margin:0"><iframe id="f" style="width:100vw;height:100vh;border:0;display:block"></iframe><pre id="o" style="position:fixed;bottom:0;left:0;margin:0;background:#000;color:#0f0;font:12px monospace;z-index:9;max-width:100%;white-space:pre-wrap"></pre>
<script>
sessionStorage.setItem('booted','1'); localStorage.removeItem('view'); localStorage.setItem('theme','dark'); f.src='index.html'
const wait = ms => new Promise(r => setTimeout(r, ms))
const log = s => o.textContent += s + '\n'
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument
  w.addEventListener('error', e => log('ERR ' + e.message + ' @' + e.lineno))
  w.requestAnimationFrame = cb => w.setTimeout(() => cb(w.performance.now()), 16)
  await wait(500)
  w.raceMode.start()
  const shot = location.hash === '#shot'
  for (let i = 0; i < (shot ? 1 : 14); i++) {
    await wait(shot ? 6000 : 2000)
    const ai = d.querySelector('.race-ai').style.transform.match(/translate\(([-\d.]+)px, ([-\d.]+)px/)
    log(((i + 1) * 2) + 's  hud: ' + d.querySelector('.race-hud').textContent.replace(/\s+/g, ' ') + ' | ai at ' + (ai ? Math.round(ai[1]) + ',' + Math.round(ai[2]) : '?') + ' | panel ' + !d.querySelector('.race-panel').hidden)
  }
}
</script>
